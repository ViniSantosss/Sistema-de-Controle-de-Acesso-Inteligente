<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>

        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html">
                <span>Painel</span>
            </a>

            <a href="/users.html" aria-current="page">
                <span>Usuários</span>
            </a>

            <a href="/performance.html">
                <span>Performance</span>
            </a>

            <a href="/config.html">
                <span>Configurações</span>
            </a>

            <a class="about-nav-link" href="/about.html" aria-label="Sobre" title="Sobre">
                <span aria-hidden="true">?</span>
            </a>
        </nav>
    </header>

    <main class="page-content">

        <div class="page-heading">
            <p class="eyebrow">ACESSO E CREDENCIAIS</p>
            <h1>Usuários</h1>
        </div>

        <section class="page-section user-form-section">

            <h3>
                <svg class="icon section-icon" aria-hidden="true">
                    <use href="/icons.svg#user-round-plus"></use>
                </svg>
                Cadastrar usuário
            </h3>

            <form id="usuarioForm">

                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <input type="hidden" id="usuarioId">

                <label for="tipoAcesso">Tipo de acesso</label>

                <select id="tipoAcesso">
                    <option value="permanente">Permanente</option>
                    <option value="temporario">Temporário</option>
                </select>

                <div class="validity-fields" id="validadeCampos" hidden>
                    <label for="dataExpiracao">Data e hora de expiração</label>
                    <input type="datetime-local" id="dataExpiracao">
                    <small>Horário de São Paulo (UTC-03:00).</small>
                </div>

                <button type="submit">
                    Cadastrar usuário
                </button>
                <button type="button" id="cancelarEdicao" hidden>
                    Cancelar edição
                </button>

            </form>

            <p id="mensagem"></p>

        </section>

        <section class="page-section">

            <h3>
                <svg class="icon section-icon" aria-hidden="true">
                    <use href="/icons.svg#users-round"></use>
                </svg>
                Usuários cadastrados
            </h3>

            <div class="table-wrap">

                <table class="users-table">

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Credencial</th>
                            <th>Acesso</th>
                            <th>Validade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaUsuarios">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
