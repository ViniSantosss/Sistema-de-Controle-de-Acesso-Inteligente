<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html">Painel</a>
            <a href="/users.html" aria-current="page">Usuários</a>
            <a href="/config.html">Configurações</a>
            <a href="/performance.html">Performance</a>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-heading">
            <p class="eyebrow">ACESSO E CREDENCIAIS</p>
            <h1>Usuários</h1>
        </div>

        <section class="page-section">
            <h3>Cadastrar usuário</h3>

            <form id="usuarioForm">

                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="credencial">Credencial NFC</label>
                <input type="text" id="credencial" required>

                <label for="tipoAcesso">Tipo de acesso</label>
                <select id="tipoAcesso">
                    <option value="permanente">Permanente</option>
                    <option value="temporario">Temporário</option>
                </select>

                <button type="submit">Cadastrar usuário</button>

            </form>

            <p id="mensagem"></p>
        </section>

        <section class="page-section">
            <h3>Usuários cadastrados</h3>

            <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Credencial</th>
                        <th>Acesso</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="listaUsuarios">
                </tbody>
            </table>
            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
