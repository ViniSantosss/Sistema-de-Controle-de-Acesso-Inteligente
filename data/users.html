<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <h1>Sistema de Controle de Acesso</h1>

        <nav>
            <a href="/panel.html">Painel</a>
            <a href="/usuarios.html">Usuários</a>
            <a href="/configuracoes.html">Configurações</a>
            <a href="/performance.html">Performance</a>
        </nav>
    </header>

    <main>

        <h2>Usuários</h2>

        <section>
            <h3>Cadastrar usuário</h3>

            <form id="usuarioForm">

                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="credencial">Credencial NFC</label>
                <input type="text" id="credencial" required>

                <label for="tipoAcesso">Tipo de acesso</label>
                <select id="tipoAcesso">
                    <option value="permanente">Permanente</option>
                    <option value="temporario">Temporário</option>
                </select>

                <button type="submit">Cadastrar usuário</button>

            </form>

            <p id="mensagem"></p>
        </section>

        <section>
            <h3>Usuários cadastrados</h3>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Credencial</th>
                        <th>Acesso</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="listaUsuarios">
                </tbody>
            </table>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
