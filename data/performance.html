<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>

        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html">
                <span>Painel</span>
            </a>

            <a href="/users.html">
                <span>Usuários</span>
            </a>

            <a href="/config.html">
                <span>Configurações</span>
            </a>

            <a href="/performance.html" aria-current="page">
                <span>Performance</span>
            </a>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-heading">
            <p class="eyebrow">SAÚDE DO DISPOSITIVO</p>
            <h1>Monitoramento de performance</h1>
        </div>

        <div class="metrics-grid">
            <section class="page-section metric-section">
                <h3>
                    <svg class="icon section-icon" aria-hidden="true">
                        <use href="/icons.svg#cpu"></use>
                    </svg>
                    Processador
                </h3>

                <p>Uso do Core 0: <span id="core0">--</span>%</p>
                <p>Uso do Core 1: <span id="core1">--</span>%</p>
            </section>

            <section class="page-section metric-section">
                <h3>
                    <svg class="icon section-icon" aria-hidden="true">
                        <use href="/icons.svg#memory-stick"></use>
                    </svg>
                    Memória
                </h3>
                <p>RAM utilizada: <span id="ram">--</span></p>
            </section>

            <section class="page-section metric-section">
                <h3>
                    <svg class="icon section-icon" aria-hidden="true">
                        <use href="/icons.svg#hard-drive"></use>
                    </svg>
                    Armazenamento
                </h3>
                <p>Flash utilizada: <span id="flash">--</span></p>
            </section>

            <section class="page-section metric-section">
                <h3>
                    <svg class="icon section-icon" aria-hidden="true">
                        <use href="/icons.svg#activity"></use>
                    </svg>
                    Comunicação
                </h3>
                <p>Tempo de resposta: <span id="tempoResposta">--</span> ms</p>
            </section>
        </div>
    </main>

    <script src="/js/app.js"></script>

</body>

</html>
