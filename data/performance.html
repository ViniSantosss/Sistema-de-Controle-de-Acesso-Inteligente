<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html">Painel</a>
            <a href="/users.html">Usuários</a>
            <a href="/config.html">Configurações</a>
            <a href="/performance.html" aria-current="page">Performance</a>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-heading">
            <p class="eyebrow">SAÚDE DO DISPOSITIVO</p>
            <h1>Monitoramento de performance</h1>
        </div>

        <div class="metrics-grid">
        <section class="page-section metric-section">
            <h3>Processador</h3>
            <p>Uso da CPU: <span id="cpu">--</span></p>
        </section>

        <section class="page-section metric-section">
            <h3>Memória</h3>
            <p>RAM livre: <span id="ram">--</span></p>
        </section>

        <section class="page-section metric-section">
            <h3>Armazenamento</h3>
            <p>Flash utilizada: <span id="flash">--</span></p>
        </section>

        <section class="page-section metric-section">
            <h3>Comunicação</h3>
            <p>Tempo de resposta: <span id="tempoResposta">--</span></p>
        </section>
        </div>
    </main>

    <script src="/js/app.js"></script>

</html>
