<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/icons.svg#layout-dashboard"></use></svg><span>Painel</span></a>
            <a href="/users.html"><svg class="icon" aria-hidden="true"><use href="/icons.svg#users-round"></use></svg><span>Usuários</span></a>
            <a href="/config.html"><svg class="icon" aria-hidden="true"><use href="/icons.svg#settings"></use></svg><span>Configurações</span></a>
            <a href="/performance.html"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chart-no-axes-column-increasing"></use></svg><span>Performance</span></a>
        </nav>
    </header>
    <main class="page-content">

    <div class="page-heading">
        <p class="eyebrow">VISÃO GERAL</p>
        <h1>Painel do sistema</h1>
    </div>

    <section class="dashboard-grid">

        <div class="dashboard-card">
            <span class="dashboard-label">Usuários cadastrados</span>
            <strong id="totalUsuarios">--</strong>
        </div>

        <div class="dashboard-card">
            <span class="dashboard-label">Usuários ativos</span>
            <strong id="usuariosAtivos">--</strong>
        </div>

        <div class="dashboard-card">
            <span class="dashboard-label">Usuários desativados</span>
            <strong id="usuariosDesativados">--</strong>
        </div>

        <div class="dashboard-card">
            <span class="dashboard-label">Status do sistema</span>
            <strong id="statusSistema">--</strong>
        </div>

    </section>

    <section class="page-section">

        <h3>
            <svg class="icon section-icon" aria-hidden="true">
                <use href="/icons.svg#wifi"></use>
            </svg>
            Conectividade
        </h3>

        <p>
            Wi-Fi:
            <strong id="painelWifi">--</strong>
        </p>

        <p>
            IP do ESP32:
            <strong id="painelIp">--</strong>
        </p>

    </section>

    <section class="page-section">

        <h3>
            <svg class="icon section-icon" aria-hidden="true">
                <use href="/icons.svg#layout-dashboard"></use>
            </svg>
            Acesso rápido
        </h3>

        <div class="dashboard-actions">

            <a href="/users.html">
                Gerenciar usuários
            </a>

            <a href="/config.html">
                Configurações
            </a>

            <a href="/performance.html">
                Performance
            </a>

        </div>

    </section>

</main>
</body>
</html>
