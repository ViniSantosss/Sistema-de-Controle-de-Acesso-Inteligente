<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html"><svg class="icon" aria-hidden="true"><use href="/icons.svg#layout-dashboard"></use></svg><span>Painel</span></a>
            <a href="/users.html"><svg class="icon" aria-hidden="true"><use href="/icons.svg#users-round"></use></svg><span>Usuários</span></a>
            <a href="/config.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/icons.svg#settings"></use></svg><span>Configurações</span></a>
            <a href="/performance.html"><svg class="icon" aria-hidden="true"><use href="/icons.svg#chart-no-axes-column-increasing"></use></svg><span>Performance</span></a>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-heading">
            <p class="eyebrow">PREFERÊNCIAS DO DISPOSITIVO</p>
            <h1>Configurações</h1>
        </div>

        <section class="page-section">
    <h3>
        <svg class="icon section-icon" aria-hidden="true">
            <use href="/icons.svg#settings"></use>
        </svg>
        Sistema
    </h3>

    <div class="settings-form">
        <div class="deep-sleep-control" id="deepSleepControl">
            <div class="deep-sleep-heading">
                <div>
                    <h4>Deep Sleep</h4>
                    <p>Reduz o consumo de energia e interrompe o acesso ao dispositivo.</p>
                </div>
                <span class="deep-sleep-status is-off" id="deepSleepStatus" aria-live="polite">
                    <span class="deep-sleep-status-dot" aria-hidden="true"></span>
                    Desligado
                </span>
            </div>

            <button class="deep-sleep-button" id="ativarDeepSleep" type="button">
                Ativar Deep Sleep
            </button>
            <p class="deep-sleep-message" id="deepSleepMessage" role="status" aria-live="polite"></p>
        </div>

    </div>
</section>

        <section class="page-section">
            <h3><svg class="icon section-icon" aria-hidden="true"><use href="/icons.svg#wifi"></use></svg>Rede</h3>

            <p>Wi-Fi: <span id="wifiStatus">--</span></p>
            <p>IP do ESP32: <span id="ip">--</span></p>
        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
