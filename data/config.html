<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="page-header">
        <a class="page-brand" href="/" aria-label="Controle de Acesso, início">
            <span class="brand-mark" aria-hidden="true">CA</span>
            <span>Controle de Acesso</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/panel.html">Painel</a>
            <a href="/users.html">Usuários</a>
            <a href="/config.html" aria-current="page">Configurações</a>
            <a href="/performance.html">Performance</a>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-heading">
            <p class="eyebrow">PREFERÊNCIAS DO DISPOSITIVO</p>
            <h1>Configurações</h1>
        </div>

        <section class="page-section">
            <h3>Sistema</h3>

            <div class="settings-form">
                <label for="nomeSistema">Nome do sistema</label>
                <input type="text" id="nomeSistema">

                <label for="modo">Modo de funcionamento</label>
                <select id="modo">
                    <option value="normal">Normal</option>
                    <option value="offline">Offline</option>
                </select>

                <button id="salvarConfiguracoes">
                    Salvar configurações
                </button>
            </div>
        </section>

        <section class="page-section">
            <h3>Rede</h3>

            <p>Wi-Fi: <span id="wifiStatus">--</span></p>
            <p>IP do ESP32: <span id="ip">--</span></p>
        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
